name: Monatliche Wartung

# Am 1. jedes Monats: prüft alle externen Links (Quellen, Partner), ob die Amazon-Produkte noch existieren und ob Preis und Artikel noch aktuell sind.
# Findet die Prüfung etwas, schlägt der Lauf fehl und GitHub schickt eine E-Mail mit der Liste.
on:
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wartung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Externe Links
        if: always()
        run: npm run --silent check:links | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Amazon-Produkte
        if: always()
        run: npm run --silent check:partner | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preise und Prüfdaten
        if: always()
        run: npm run --silent check:frische | tee -a "$GITHUB_STEP_SUMMARY"
