name: Seite veröffentlichen (ALL-INKL)

on:
  push:
    branches: [main]
  # Montag und Donnerstag früh: baut die Seite neu, damit der Pinterest-Feed fällige Rezepte freigibt
  schedule:
    - cron: '17 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:plans
      - run: npm run check:rechner
      - run: npm run build
      - name: Offene Punkte vor dem Start
        run: |
          echo '### Start-Check' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm run --silent check:launch >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Weiterleitungen für die alte github.io-Adresse
        run: node scripts/weiterleitung.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: seite
          path: dist
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-weiterleitung

  # Die Seite liegt bei ALL-INKL. Zugangsdaten als Repository-Secrets (README, „Hosting bei ALL-INKL“).
  allinkl:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Zugangsdaten vorhanden?
        env:
          HOST: ${{ secrets.ALLINKL_FTP_HOST }}
          USER: ${{ secrets.ALLINKL_FTP_USER }}
          PASS: ${{ secrets.ALLINKL_FTP_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Secrets ALLINKL_FTP_HOST, ALLINKL_FTP_USER und ALLINKL_FTP_PASSWORD fehlen. Die alte Seite bleibt online, bis sie eingetragen sind."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: seite
          path: dist
      - name: Hochladen zu ALL-INKL (FTP mit TLS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ALLINKL_FTP_HOST }}
          username: ${{ secrets.ALLINKL_FTP_USER }}
          password: ${{ secrets.ALLINKL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

  # github.io zeigt nur noch Weiterleitungen, und erst wenn ALL-INKL aktuell ist
  deploy:
    needs: allinkl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
